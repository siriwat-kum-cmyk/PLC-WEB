name: SCADA CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint, and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Automated Unit & Validation Tests
        run: npm run test

      - name: TypeScript Type Check
        run: npm run type-check

      - name: ESLint Code Quality Inspection
        run: npm run lint

      - name: Next.js Production Build
        run: npm run build
